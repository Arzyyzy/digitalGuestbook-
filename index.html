<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport: initial-scale=1.0 tanpa user-scalable=no
      Di Xibo, user-scalable=no kadang conflict dengan touch event handling.
      Biarkan default, scaling dikontrol dari Xibo region settings.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Guestbook</title>
    <style>
      /*
        PENTING UNTUK XIBO SIGNAGE:

        Gunakan height: 100%, BUKAN height: 100vh.

        Alasan:
        - 100vh di Xibo mengambil tinggi penuh monitor (mis. 1080px)
          meskipun web region yang dialokasikan hanya setengahnya (540px).
        - 100% mengikuti tinggi container yang diberikan Xibo.

        Untuk split layout (atas: slideshow, bawah: guestbook):
        Set Xibo Web Region: width=1920, height=540, y=540 (bottom half).
        Web akan otomatis mengisi area tersebut dengan height: 100%.

        touch-action: none di html/body WAJIB agar touch events sampai
        ke canvas tanpa diintercept browser/Xibo sebagai scroll gesture.
      */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        -ms-touch-action: none;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
